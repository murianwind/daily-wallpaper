name: wallpaper

on:
  schedule:
    # timezone 을 지정해 한국 시각 기준으로 돈다. 04:00(낮 그림) / 16:00(밤 그림).
    # 단축어 자동화는 07:00 / 18:00 에 받아간다.
    - cron: "0 4 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 16 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      slot:
        description: "생성할 시간대 (auto 는 한국 시각 12시 이전이면 day, 이후면 night)"
        type: choice
        options: [auto, day, night]
        default: auto

# 겹쳐 실행되어 배포가 뒤섞이지 않도록 한 번에 하나만 돌린다.
concurrency:
  group: wallpaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate wallpaper
        env:
          PYTHONPATH: src
          # 예약 실행은 auto: 한국 시각 12시 이전이면 낮, 이후면 밤(크론 식에 의존하지 않는다).
          SLOT: ${{ inputs.slot || 'auto' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WALLPAPER_MODEL: ${{ vars.WALLPAPER_MODEL }}
          # 직전 실행이 쓴 명승지 기록(latest.json 의 recent_spot_ids)을 읽어 겹치지 않게 고른다.
          LATEST_JSON_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.json
        run: python -m wallpaper.main --slot "$SLOT" --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 자동으로 꺼진다.
  # 워크플로를 다시 "enable" 하는 호출로 막아 보는 보조 장치(효과는 첫 두 달 뒤에 확인 필요).
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable wallpaper.yml --repo "${{ github.repository }}"
