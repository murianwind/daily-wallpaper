name: wallpaper

on:
  schedule:
    # cron 은 UTC 기준. 06:00 KST(낮) / 17:30 KST(밤). 단축어 자동화는 07:00 / 18:00 에 받아간다.
    - cron: "0 21 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "생성할 시간대 (auto 는 한국 시각 12시 이전이면 day, 이후면 night)"
        type: choice
        options: [auto, day, night]
        default: auto

# 겹쳐 실행되어 배포가 뒤섞이지 않도록 한 번에 하나만 돌린다.
concurrency:
  group: wallpaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate wallpaper
        env:
          PYTHONPATH: src
          # 예약 실행은 크론 식으로 시간대를 정하고(지연되어도 안전), 수동 실행은 입력값을 쓴다.
          SLOT: ${{ inputs.slot || (github.event.schedule == '30 8 * * *' && 'night' || 'day') }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WALLPAPER_MODEL: ${{ vars.WALLPAPER_MODEL }}
        run: python -m wallpaper.main --slot "$SLOT" --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 자동으로 꺼진다.
  # 워크플로를 다시 "enable" 하는 호출로 막아 보는 보조 장치(효과는 첫 두 달 뒤에 확인 필요).
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable wallpaper.yml --repo "${{ github.repository }}"
